name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check all stable targets
        run: moon check --deny-warn --target all

      - name: Run default tests
        run: moon test --deny-warn

      - name: Run native tests on Unix
        if: runner.os != 'Windows'
        run: moon test --deny-warn --target native

      - name: Run benchmark smoke test
        if: runner.os == 'Linux'
        run: moon bench benchmarks

      - name: Verify package metadata and clean formatting
        run: |
          moon info
          git diff --exit-code
